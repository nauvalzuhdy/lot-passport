name: ci
on: [push, pull_request]
jobs:
  core:
    name: Pure logic tests (rustc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/test-core.sh
  contract:
    name: Contract unit tests and wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # near-sdk 5.30 requires rustc 1.95 or newer, so this tracks stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test
        working-directory: contract
      - run: cargo build --release --target wasm32-unknown-unknown
        working-directory: contract
  relayer:
    name: Relayer policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test policy.test.mjs
        working-directory: server
