[package]
name = "lot-passport"
version = "0.1.0"
edition = "2021"
description = "Lot Passport: a NEP-171 token per batch of goods that holds its own payment and quality-inspection record"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(standalone)"] }
